name: Verify

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # A pull request checks out its merge commit; HEAD^1 is the base it merges into.
          fetch-depth: 2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Install dependencies
        # Install scripts stay disabled to prevent supply-chain attacks.
        run: YARN_ENABLE_SCRIPTS=false yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Guardrails
        run: yarn check:guardrails ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}

      - name: Playwright discovery
        run: yarn check:playwright-discovery
